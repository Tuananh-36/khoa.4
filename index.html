<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Wonders of Nature Gallery</h1>
    <p>Explore breathtaking landscapes from around the world.</p>
  </header>

  <main class="gallery">
    <figure>
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Serene mountain lake surrounded by pine trees at sunrise">
      <figcaption>
        <p>Misty Mountain Lake - A tranquil view of clear waters reflecting peak morning sunlight.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600" alt="Foggy forest path lined with tall green trees">
      <figcaption>
        <p>Enchanted Forest - Deep woods covered in morning fog creating a calming natural path.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Sunlight filtering through dense jungle leaves">
      <figcaption>
        <p>Golden Rays - Vibrant sunlight piercing through the dense canopy of a lush forest.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600" alt="Green rolling hills under a cloudy sunset sky">
      <figcaption>
        <p>Rolling Hills - Endless green meadows stretching across peaceful countryside valleys.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Dramatic ocean coastline with waves crashing against rocks">
      <figcaption>
        <p>Ocean Breeze - Powerful coastal waves meeting rugged rock formations at dusk.</p>
      </figcaption>
    </figure>
  </main>

</body>
</html>
